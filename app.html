<style>
:root{
--cream:#F8FAFC;--paper:#FFF;--ink:#0F172A;--ink-2:#1E293B;--muted:#64748B;--muted-2:#94A3B8;
--border:#E2E8F0;--border-2:#CBD5E1;--action:#2563EB;--action-2:#1D4ED8;
--success:#16A34A;--success-bg:#F0FDF4;--danger:#DC2626;--danger-bg:#FEF2F2;--warn:#D97706;--warn-bg:#FFFBEB;
--info:#0284C7;--info-bg:#F0F9FF;--cobrado:#0D9488;--cobrado-bg:#F0FDFA;
--radius:10px;--radius-lg:16px;--shadow-sm:0 1px 2px rgba(15,23,42,.05);--shadow:0 4px 14px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Inter',-apple-system,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h1{font-size:36px}h2{font-size:25px;line-height:1.25}h3{font-size:18px}
.mono{font-family:'Inter',-apple-system,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.muted{color:var(--muted)}.muted-2{color:var(--muted-2)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--paper);border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:30px;height:30px;background:var(--action);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:800;line-height:1}
.brand-name{font-family:'Inter',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand-name em{color:var(--action);font-style:normal;font-weight:800}
.nav{display:flex;gap:3px;flex-wrap:wrap}
.nav-btn{padding:6px 12px;font-size:13px;color:var(--muted);border-radius:7px;font-weight:500;transition:all .15s;white-space:nowrap}
.nav-btn:hover{background:var(--border);color:var(--ink)}.nav-btn.active{background:var(--ink);color:var(--cream)}
.biz-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-shrink:0}
.biz-label .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.main{flex:1;padding:30px 28px 70px;max-width:1200px;margin:0 auto;width:100%}
.view{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;font-size:13.5px;font-weight:500;border-radius:8px;transition:all .15s;line-height:1;min-height:36px;white-space:nowrap}
.btn-primary{background:var(--ink);color:var(--cream)}.btn-primary:hover{background:var(--ink-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-action{background:var(--action);color:#fff}.btn-action:hover{background:var(--action-2);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--border-2)}.btn-ghost:hover{background:var(--paper);border-color:var(--ink)}
.btn-soft{background:var(--paper);color:var(--ink);border:1px solid var(--border)}.btn-soft:hover{border-color:var(--border-2)}
.btn-danger-ghost{background:transparent;color:var(--danger);border:1px solid transparent}.btn-danger-ghost:hover{background:var(--danger-bg)}
.btn-success-ghost{background:transparent;color:var(--success);border:1px solid transparent}.btn-success-ghost:hover{background:var(--success-bg)}
.btn-info-ghost{background:transparent;color:var(--info);border:1px solid transparent}.btn-info-ghost:hover{background:var(--info-bg)}
.btn-sm{padding:5px 9px;font-size:12px;min-height:28px}.btn-lg{padding:13px 20px;font-size:14.5px;min-height:44px}
.btn svg{width:15px;height:15px;flex-shrink:0}
.field{margin-bottom:14px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
.input,.select,.textarea{width:100%;padding:9px 11px;background:var(--paper);border:1px solid var(--border);border-radius:7px;font-size:13.5px;color:var(--ink);transition:all .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.textarea{min-height:70px;resize:vertical}.input-mono{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums}.input-sm{padding:6px 9px;font-size:12.5px}
.hint{font-size:11px;color:var(--muted-2);margin-top:3px}
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm)}
.card-title{font-family:'Inter',sans-serif;font-weight:700;font-size:18px;margin-bottom:4px}
.card-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.wizard{max-width:600px;margin:16px auto;padding:30px 16px}
.wizard-head{text-align:center;margin-bottom:32px}
.wizard-head h1{margin-bottom:12px}.wizard-head h1 em{color:var(--action);font-style:normal;font-weight:800}
.wizard-head p{color:var(--muted);font-size:14.5px;max-width:420px;margin:0 auto}
.logo-upload{display:flex;align-items:center;gap:12px;padding:12px;background:var(--cream);border:1.5px dashed var(--border-2);border-radius:9px;cursor:pointer;transition:all .15s}
.logo-upload:hover{border-color:var(--ink);background:var(--paper)}.logo-upload input{display:none}
.logo-preview{width:52px;height:52px;border-radius:7px;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-preview img{max-width:100%;max-height:100%;object-fit:contain}.logo-preview svg{width:20px;height:20px;color:var(--muted)}
.logo-text{flex:1}.logo-text strong{font-size:13px;display:block;font-weight:500}.logo-text span{font-size:11.5px;color:var(--muted-2)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:28px}
.stat-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm)}
.stat-label{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;font-weight:500}
.stat-val{font-family:'Inter',sans-serif;font-weight:700;font-size:28px;line-height:1;margin-bottom:3px}
.stat-val.mono{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;letter-spacing:-.01em}
.stat-sub{font-size:11.5px;color:var(--muted-2)}
.home-cta{background:linear-gradient(135deg,var(--action),var(--action-2));color:#fff;border-radius:var(--radius-lg);padding:32px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.home-cta-copy h2{color:#fff;margin-bottom:7px}.home-cta-copy h2 em{color:#fff;font-style:normal;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:rgba(255,255,255,.45)}
.home-cta-copy p{color:rgba(255,255,255,.8);max-width:400px;font-size:14px}
.home-cta .btn-action{background:#fff;color:var(--action)}.home-cta .btn-action:hover{background:#F1F5F9;transform:translateY(-1px)}
.builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.builder-form{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm)}
.builder-preview{position:sticky;top:90px;align-self:start}
.section-title{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}.section-title .line{flex:1;height:1px;background:var(--border)}
.items{border-top:1px solid var(--border);margin-top:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 55px 50px 115px 105px 28px;gap:5px;padding:10px 0;border-bottom:1px solid var(--border);align-items:start}
.item-desc{font-size:13px}.item-desc input{border:none;background:transparent;padding:3px 0;font-weight:500;width:100%}.item-desc input:focus{outline:none;border-bottom:1px solid var(--ink)}
.item-num{text-align:right}.item-num input{text-align:right;padding:5px 7px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:12.5px}
.item-total{text-align:right;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;padding-top:6px}
.item-remove{display:flex;align-items:center;justify-content:center;padding-top:3px}
.item-remove button{width:26px;height:26px;border-radius:5px;color:var(--muted-2);transition:all .15s}.item-remove button:hover{background:var(--danger-bg);color:var(--danger)}
.item-header{display:grid;grid-template-columns:minmax(0,1fr) 55px 50px 115px 105px 28px;gap:5px;padding-bottom:6px;border-bottom:1px solid var(--border);font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.item-header .item-num,.item-header .item-total{text-align:right}
.item-add{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;margin-top:10px;font-size:12.5px;color:var(--ink);border:1px dashed var(--border-2);border-radius:7px;transition:all .15s;font-weight:500}
.item-add:hover{border-color:var(--ink);background:var(--cream)}
.item-photo{margin-top:4px}.item-photo img{max-width:60px;max-height:40px;border-radius:4px;border:1px solid var(--border);cursor:pointer}
.item-photo-btn{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted-2);cursor:pointer;padding:3px 6px;border:1px dashed var(--border-2);border-radius:5px;transition:all .15s}
.item-photo-btn:hover{border-color:var(--muted);color:var(--ink)}
.totals{margin-top:16px;padding:14px 16px;background:var(--cream);border-radius:9px;border:1px solid var(--border)}
.totals-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px;color:var(--muted)}
.totals-row strong{font-weight:500;color:var(--ink)}
.totals-row.grand{margin-top:8px;padding-top:10px;border-top:1px solid var(--border-2);font-size:15px;color:var(--ink)}
.totals-row.grand strong{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--action)}
.preview{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 28px;box-shadow:var(--shadow);min-height:500px;font-size:12.5px;line-height:1.55}
.preview-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.preview-biz h3{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;margin-bottom:5px}
.preview-biz-logo{margin-bottom:10px;max-width:120px;max-height:50px}
.preview-biz-info{font-size:11px;color:var(--muted);line-height:1.6}
.preview-meta{text-align:right}
.preview-meta-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;font-weight:500}
.preview-meta-num{font-family:'Inter',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em;margin-bottom:8px;color:var(--action)}
.preview-meta-dates{font-size:11px;color:var(--muted);line-height:1.7}
.preview-client{margin-bottom:18px}
.preview-client-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500}
.preview-client-name{font-size:15px;font-weight:500;margin-bottom:2px}
.preview-client-info{font-size:11px;color:var(--muted)}
.preview-items{width:100%;border-collapse:collapse;margin-bottom:16px}
.preview-items th{text-align:left;padding:7px 5px;border-bottom:1.5px solid var(--ink);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.preview-items th:nth-child(2),.preview-items th:nth-child(3),.preview-items th:nth-child(4){text-align:right}
.preview-items td{padding:8px 5px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:top}
.preview-items td:nth-child(2),.preview-items td:nth-child(3),.preview-items td:nth-child(4){text-align:right;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:11.5px}
.preview-totals{margin-left:auto;width:50%;margin-top:10px}
.preview-totals-row{display:flex;justify-content:space-between;padding:3px 5px;font-size:12px;color:var(--muted)}
.preview-totals-row strong{color:var(--ink);font-weight:500}
.preview-totals-row.grand{margin-top:5px;padding-top:7px;border-top:1.5px solid var(--ink);font-size:14px;color:var(--ink)}
.preview-totals-row.grand strong{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--action)}
.preview-notes{margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
.preview-notes-title{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500}
.preview-notes-body{font-size:11.5px;color:var(--muted);line-height:1.65;white-space:pre-wrap}
.preview-footer{margin-top:30px;padding-top:14px;border-top:1px dashed var(--border-2);display:flex;justify-content:space-between;gap:30px}
.preview-sig{flex:1;text-align:center}.preview-sig-line{height:1px;background:var(--border-2);margin-bottom:5px}.preview-sig-label{font-size:10px;color:var(--muted-2)}
.history-filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:5px 12px;font-size:12px;border-radius:99px;background:var(--paper);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;font-weight:500}
.filter-chip:hover{border-color:var(--border-2);color:var(--ink)}.filter-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.history-list{display:flex;flex-direction:column;gap:8px}
.quote-row{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:grid;grid-template-columns:85px 1fr 120px 120px auto;gap:16px;align-items:center;transition:all .15s;box-shadow:var(--shadow-sm);cursor:pointer}
.quote-row:hover{border-color:var(--border-2);box-shadow:var(--shadow)}
.q-num{font-family:'Inter',sans-serif;font-weight:700;font-size:15px}
.q-client strong{display:block;font-size:13.5px;font-weight:500}.q-client span{font-size:11px;color:var(--muted)}
.q-date{font-size:11.5px;color:var(--muted);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums}
.q-amount{text-align:right;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}
.q-actions{display:flex;gap:3px;justify-content:flex-end;flex-wrap:wrap}
.status-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em}
.status-pill .d{width:5px;height:5px;border-radius:50%}
.status-pendiente{background:var(--warn-bg);color:var(--warn)}.status-pendiente .d{background:var(--warn)}
.status-aceptado{background:var(--success-bg);color:var(--success)}.status-aceptado .d{background:var(--success)}
.status-rechazado{background:var(--danger-bg);color:var(--danger)}.status-rechazado .d{background:var(--danger)}
.status-en_ejecucion{background:var(--info-bg);color:var(--info)}.status-en_ejecucion .d{background:var(--info)}
.status-cobrado{background:var(--cobrado-bg);color:var(--cobrado)}.status-cobrado .d{background:var(--cobrado)}
.empty{text-align:center;padding:50px 20px}
.empty h3{font-family:'Inter',sans-serif;font-weight:700;font-size:21px;margin-bottom:8px}.empty h3 em{color:var(--action);font-style:normal;font-weight:800}
.empty p{color:var(--muted);margin-bottom:18px;max-width:340px;margin-left:auto;margin-right:auto;font-size:13.5px}
.modal-bg{background:rgba(15,23,42,.5);position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .15s}
.modal{background:var(--paper);border-radius:var(--radius-lg);padding:24px;max-width:460px;width:100%;box-shadow:0 16px 40px rgba(15,23,42,.25);max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Inter',sans-serif;font-weight:700;font-size:20px;margin-bottom:6px}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.modal-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideUp .25s;z-index:100}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tpl-cats{margin-bottom:14px}
.tpl-cat-label{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.tpl-cat-label .cline{flex:1;height:1px;background:var(--border)}
.templates{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:7px}
.tpl{padding:10px;background:var(--paper);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;text-align:left}
.tpl:hover{border-color:var(--border-2);background:var(--cream)}
.tpl.active{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.tpl-name{font-size:12px;font-weight:500;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-desc{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl.active .tpl-desc{color:rgba(255,255,255,.6)}
.reminder-box{background:var(--warn-bg);border:1px solid #D9770633;border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.reminder-box .r-icon{font-size:18px;flex-shrink:0;line-height:1}
.reminder-box .r-text{flex:1;font-size:13px;color:var(--warn)}
.reminder-box .r-text strong{font-weight:500}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.catalog-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:all .15s}
.catalog-card:hover{border-color:var(--border-2);box-shadow:var(--shadow-sm)}
.cc-info{flex:1;min-width:0}.cc-desc{font-size:13.5px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-meta{font-size:11.5px;color:var(--muted)}.cc-price{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--action);flex-shrink:0}
.cc-actions{display:flex;gap:3px;flex-shrink:0}
.feedback-fab{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:50%;background:var(--action);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(37,99,235,.4);transition:all .15s;z-index:40}
.feedback-fab:hover{background:var(--action-2);transform:translateY(-2px) scale(1.05)}
@media(max-width:960px){.feedback-fab{bottom:16px;right:16px;width:46px;height:46px;font-size:19px}}
@media(max-width:960px){
.topbar{padding:10px 14px}.main{padding:20px 14px 50px}.home-grid{grid-template-columns:1fr 1fr}
.home-cta{flex-direction:column;text-align:center;padding:24px 18px}

modal.innerHTML=`<div class="modal"><div class="modal-title">💡 Tu opinión nos ayuda</div>

document.body.appendChild(modal);modal.onclick=e=>{if(e.target===modal)modal.remove()};

const{error}=await sb.from('feedback').insert({user_id:S.session.user.id,message:msg,page:S.view});
if(error){toast('Error al enviar, intentá de nuevo');console.error(error);btn.disabled=false;return}
modal.remove();toast('¡Gracias! Recibimos tu sugerencia')}}

const list=S.quotes.filter(q=>S.filter==='todos'||q.status===S.filter).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
w.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;flex-wrap:wrap;gap:14px">
<div><h2 class="serif">Historial</h2><p class="muted" style="font-size:13px;margin-top:3px">${S.quotes.length} presupuestos</p></div>
<div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-soft btn-sm" id="xlsBtn">${icoDL()} Exportar Excel</button><button class="btn btn-action btn-sm" id="newHQ">${icoPlus()} Nuevo</button></div></div>
<div class="history-filters">${filters.map(f=>`<button class="filter-chip ${S.filter===f.id?'active':''}" data-f="${f.id}">${f.l}</button>`).join('')}</div>
<div class="history-list" id="hList"></div>`;

function renderQRow(q){const t=calc(q).total;const days=daysSince(q.createdAt);const staleTag=q.status==='pendiente'&&days>=3?`<span style="font-size:10px;color:var(--warn);margin-left:4px">(${days}d)</span>`:'';
return`<div class="quote-row" data-id="${q.id}"><div class="q-num mono">N° ${q.number}</div><div class="q-client"><strong>${esc(q.client.name||'Sin cliente')}</strong><span>${q.items.length} item${q.items.length!==1?'s':''}</span></div>
<div class="q-date">${fmtDate(q.createdAt||q.date)}</div><div class="q-amount">$${fmtARS(t)}</div>
<div class="q-actions"><span class="status-pill ${STATUS_MAP[q.status].css}"><span class="d"></span>${STATUS_MAP[q.status].label}</span>${staleTag}
<button class="btn btn-soft btn-sm bv" title="Ver">${icoEye()}</button><button class="btn btn-soft btn-sm bw" title="WhatsApp">${icoWA()}</button><button class="btn btn-soft btn-sm bm" title="Más">${icoDots()}</button></div></div>`}

function attachQHandlers(root){$$('.quote-row',root).forEach(row=>{const id=row.dataset.id;const q=S.quotes.find(x=>x.id===id);
$('.bv',row).onclick=e=>{e.stopPropagation();setView('preview',q)};$('.bw',row).onclick=e=>{e.stopPropagation();sendWA(q)};$('.bm',row).onclick=e=>{e.stopPropagation();openActionsModal(q)};
row.onclick=()=>setView('preview',q)})}

const modal=document.createElement('div');modal.className='modal-bg';
modal.innerHTML=`<div class="modal"><div class="modal-title">${isNew?'Nuevo item':'Editar item'}</div>

const obj={desc:d,unit:$('#ceU',modal).value.trim()||'un',price:Number($('#ceP',modal).value)||0,category:$('#ceC',modal).value.trim()};

$$('[data-act]',modal).forEach(b=>b.onclick=async()=>{const a=b.dataset.act;
if(a==='close'){modal.remove();return}
if(a==='dup'){const draft={...JSON.parse(JSON.stringify(q)),id:null,number:pad(S.business.nextNum||1),date:new Date().toISOString(),status:'pendiente',createdAt:new Date().toISOString()};
const saved=await insertQuote(draft);if(saved&&saved.quotaExceeded){modal.remove();showQuotaModal();return}if(!saved){modal.remove();return}await bumpNextNum();S.quotes.unshift(saved);toast('Duplicado N° '+saved.number);modal.remove();setView('edit',saved);return}

for(const i of toAdd){const saved=await insertCatalogItem({desc:i.desc,unit:i.unit||'un',price:i.price||0,category:''});if(saved){S.catalog.push(saved);added++}}

if(a==='pdf'){downloadPDF(q);modal.remove();return}

if(a==='del'){if(confirm('¿Eliminar presupuesto?')){await deleteQuoteRow(q.id);S.quotes=S.quotes.filter(x=>x.id!==q.id);toast('Eliminado');modal.remove();render()}}
})}

/* ---- WHATSAPP ---- */
function sendWA(q){try{const b=S.business;if(!b){toast('Configurá tu negocio primero');return}const c=calc(q);const vu=new Date(q.date);vu.setDate(vu.getDate()+(Number(q.validityDays)||7));
const msg=`Hola${q.client.name?' '+q.client.name:''}! 👋\n\nTe paso el presupuesto:\n\n*Presupuesto N° ${q.number}*\n*${b.name}*\n\nTotal: *$${fmtARS(c.total)}*\nVálido hasta: ${fmtDate(vu)}${q.deliveryDate?'\nEntrega est.: '+fmtDate(q.deliveryDate):''}\n\nEn un momento te envío el PDF con el detalle completo. ¡Consultame cualquier duda!`;
let ph=(q.client.phone||'').replace(/\D/g,'');if(ph&&!ph.startsWith('549')&&ph.length>=10)ph='549'+ph.replace(/^0/,'').replace(/^15/,'');
downloadPDF(q,false);const url=ph?`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
setTimeout(()=>{try{const w2=window.open(url,'_blank');if(!w2)location.href=url}catch(e3){location.href=url}toast('PDF descargado. Adjuntalo en WhatsApp.')},500)}catch(e){console.error(e);toast('Error al enviar. Verificá los datos.')}}

function sendFollowUp(q){const days=daysSince(q.createdAt);
const msg=`Hola${q.client.name?' '+q.client.name:''}! 👋\n\nTe escribo por el presupuesto N° ${q.number} que te envié hace ${days} días.\n\n¿Pudiste revisarlo? Quedo atento a cualquier consulta o ajuste que necesites.\n\n¡Saludos!`;
let ph=(q.client.phone||'').replace(/\D/g,'');if(ph&&!ph.startsWith('549')&&ph.length>=10)ph='549'+ph.replace(/^0/,'').replace(/^15/,'');
const url=ph?`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
try{const w2=window.open(url,'_blank');if(!w2)location.href=url}catch(e){location.href=url}toast('Seguimiento enviado')}

/* ---- PDF ---- */
async function downloadPDF(q,showT=true){try{if(!window.jspdf){toast('Cargando generador PDF, reintentá en 2 segundos');return}const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const b=S.business;const c=calc(q);
const vu=new Date(q.date);vu.setDate(vu.getDate()+(Number(q.validityDays)||7));const M=20,W=210,R=W-M;let y=M;
if(b.logo){try{const img=await loadImg(b.logo);const ratio=img.width/img.height;const lh=16,lw=Math.min(lh*ratio,45);doc.addImage(b.logo,'PNG',M,y,lw,lh)}catch(e){}}
doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(15,23,42);doc.text(b.name,R,y+4,{align:'right'});
doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(100,116,139);let bi=y+9;

function exportXLS(){if(!window.XLSX){toast('Error: SheetJS no cargó');return}
const data=S.quotes.map(q=>{const c=calc(q);return{'N°':q.number,Cliente:q.client.name||'',Teléfono:q.client.phone||'',Fecha:fmtDate(q.createdAt||q.date),Estado:STATUS_MAP[q.status]?.label||q.status,Items:q.items.length,Subtotal:Math.round(c.subtotal),Descuento:Math.round(c.discountAmount),IVA:Math.round(c.ivaAmount),Total:Math.round(c.total)}});
const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Presupuestos');
// Detail sheet
const detail=[];S.quotes.forEach(q=>{q.items.forEach(i=>{detail.push({'N° Presup.':q.number,Cliente:q.client.name||'',Item:i.desc||'',Cantidad:i.qty,Unidad:i.unit||'','P. Unitario':i.price||0,Subtotal:Math.round((i.qty||0)*(i.price||0))})})});
const ws2=XLSX.utils.json_to_sheet(detail);XLSX.utils.book_append_sheet(wb,ws2,'Detalle Items');
XLSX.writeFile(wb,`Presupuestos_${fmtDate(new Date())}.xlsx`);toast('Excel exportado')}

/* ---- INIT ---- */
sb.auth.onAuthStateChange(async(event,session)=>{
  S.session=session;persistTokens(session);
  if(session){await loadAll();S.view=S.business?'home':'setup'}else{S.business=null;S.quotes=[];S.catalog=[];S.view='auth'}
  render();
});
(async function init(){
  let saved=null;try{saved=localStorage.getItem(SESSION_KEY)}catch(e){}
  if(saved){
    try{
      const{access_token,refresh_token}=JSON.parse(saved);
      const{data,error}=await sb.auth.setSession({access_token,refresh_token});
      if(error||!data.session){persistTokens(null);S.view='auth';render()}
      // si tiene éxito, onAuthStateChange dispara SIGNED_IN y se encarga del resto
    }catch(e){persistTokens(null);S.view='auth';render()}
  }else{S.view='auth';render()}
})();
</script>
